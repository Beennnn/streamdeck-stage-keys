<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144">
  <!-- bass flute: like a flute but larger, with the characteristic curved head crook -->
  <g transform="rotate(-12 72 78)">
    <!-- curved head crook (J shape) -->
    <path d="M44 62 q-20 0 -20 17 q0 13 14 13" fill="none" stroke="#c2c5ca" stroke-width="14" stroke-linecap="round"/>
    <path d="M44 62 q-20 0 -20 17 q0 13 14 13" fill="none" stroke="#eef0f2" stroke-width="5" stroke-linecap="round"/>
    <!-- main tube (thicker than a concert flute) -->
    <rect x="36" y="72" width="94" height="15" rx="7.5" fill="#cfd2d6"/>
    <rect x="36" y="72" width="94" height="6" rx="3" fill="#eef0f2"/>
    <!-- lip plate near the crook -->
    <ellipse cx="46" cy="79" rx="7" ry="5" fill="#aeb2b8"/>
    <!-- gold keys -->
    <g fill="#f2c14e" stroke="#9c7a1e" stroke-width="0.8">
      <circle cx="64" cy="68" r="4.6"/><circle cx="78" cy="68" r="4.6"/><circle cx="92" cy="68" r="4.6"/><circle cx="106" cy="68" r="4.6"/><circle cx="120" cy="68" r="4.6"/>
    </g>
    <!-- tone holes -->
    <g fill="#8a8e94"><circle cx="70" cy="79" r="2.3"/><circle cx="84" cy="79" r="2.3"/><circle cx="98" cy="79" r="2.3"/><circle cx="112" cy="79" r="2.3"/></g>
  </g>
</svg>
